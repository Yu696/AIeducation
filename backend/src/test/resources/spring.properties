# ============================================================================
# Spring 测试框架配置
# ============================================================================
# 关闭基于 Mockito 的测试监听器。本项目全部测试为 MockMvc 集成测试，
# 不使用 @MockBean/@SpyBean，关闭后不影响测试有效性，
# 同时避免 Mockito 在受限环境中尝试 attach JVM agent 导致初始化失败。
spring.test.mockito.context-customizer.enabled=false
spring.test.mockito.reset-listener.enabled=false
