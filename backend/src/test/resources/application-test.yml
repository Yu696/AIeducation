# ---------------- 测试环境配置 ----------------
# 使用 H2 内存库以 MySQL 兼容模式运行，保证 mvn test 不依赖本机 MySQL 是否启动。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:aijiaoxue_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.aijiaoxue: info
